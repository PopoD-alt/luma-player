plugins { id 'com.android.application' }

android {
    namespace = 'dev.sdas.luma'
    compileSdk = 37
    buildToolsVersion = '36.0.0'
    defaultConfig {
        applicationId = 'dev.sdas.luma'
        minSdk = 26
        targetSdk = 37
        versionCode = 1
        versionName = '0.1.0-preview'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    buildFeatures { buildConfig = true }
    buildTypes {
        debug { applicationIdSuffix = '.preview' }
        release { minifyEnabled = false }
    }
    compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging = false } }
}

dependencies {
    // Official candidate is pinned for development; ThirdParty audit gates redistribution.
    implementation 'org.videolan.android:libvlc-all:3.7.7'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
